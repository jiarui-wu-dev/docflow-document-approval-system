server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Requested-With XMLHttpRequest;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location /swagger-ui/ { proxy_pass http://app:8080; }
    location = /swagger-ui.html { proxy_pass http://app:8080; }
    location /v3/api-docs { proxy_pass http://app:8080; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
